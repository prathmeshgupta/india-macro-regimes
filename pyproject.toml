[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "india-macro-regimes"
version = "0.1.0"
description = "Indian macroeconomic risk-free hurdle rates, yield curves, and India VIX volatility regime gating"
authors = [{ name = "Prathmesh Gupta" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "yfinance>=0.2.30",
    "numpy>=1.24.0",
]
